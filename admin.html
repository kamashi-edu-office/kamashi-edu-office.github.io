<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ካማሺ ዞን — ዲጂታል ፖርታል (Admin)</title>
<script>
var STORAGE_KEY = "kamashi_news_data";

function checkLogin() {
    var u = document.getElementById("username").value.trim();
    var p = document.getElementById("password").value.trim();
    if (u === "admin" && (p === "1234" || p === "admin123" || p === "kamashi2026")) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        renderAdminPosts();
    } else {
        document.getElementById("errorMsg").style.display = "block";
    }
}

function quickLogin() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    renderAdminPosts();
}

function logout() {
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginSection").style.display = "block";
}

function openTab(id, btn) {
    var panels = document.querySelectorAll(".panel");
    for (var i = 0; i < panels.length; i++) panels[i].style.display = "none";
    var btns = document.querySelectorAll(".tool-btn");
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
    document.getElementById(id).style.display = "block";
    btn.classList.add("active");
}

function getSavedPosts() {
    var data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
}

function addPost() {
    var cat = document.getElementById("postCat").value;
    var title = document.getElementById("newsTitle").value.trim();
    var body = document.getElementById("newsBody").value.trim();
    if (!title || !body) { alert("እባክዎ ርዕስና ዝርዝር መልዕክት ይጻፉ!"); return; }

    var posts = getSavedPosts();
    var today = new Date().toLocaleDateString('am-ET');
    posts.unshift({ id: Date.now(), category: cat, title: title, body: body, date: today });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));

    document.getElementById("newsTitle").value = "";
    document.getElementById("newsBody").value = "";
    renderAdminPosts();
    alert("✅ መረጃው በቋሚነት ተቀምጧል! በዋናው ገጽ (index.html) ላይም ይታያል።");
}

function deletePost(id) {
    var posts = getSavedPosts().filter(function(item) { return item.id !== id; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    renderAdminPosts();
}

function renderAdminPosts() {
    var posts = getSavedPosts();
    var list = document.getElementById("postList");
    document.getElementById("postCount").innerText = posts.length + " መረጃዎች";
    if (posts.length === 0) {
        list.innerHTML = "<p style='color:#666; margin-top:12px;'>እስካሁን የተመዘገበ መረጃ የለም።</p>";
        return;
    }
    var html = "";
    for (var i = 0; i < posts.length; i++) {
        html += "<div class='card'>" +
                "<div style='display:flex; justify-content:space-between; align-items:center;'>" +
                "<span class='badge'>" + posts[i].category + " | " + posts[i].date + "</span>" +
                "<button type='button' class='btn-del' onclick='deletePost(" + posts[i].id + ")'>🗑️ አጥፋ</button>" +
                "</div>" +
                "<h4 style='margin:6px 0; color:#0a3d62;'>" + posts[i].title + "</h4>" +
                "<p>" + posts[i].body + "</p></div>";
    }
    list.innerHTML = html;
}

function addRow() {
    var tbody = document.getElementById("excelBody");
    var n = tbody.rows.length + 1;
    var row = tbody.insertRow();
    row.innerHTML = "<td contenteditable='true'>" + n + "</td><td contenteditable='true'>አዲስ ወረዳ</td><td contenteditable='true'>0</td><td contenteditable='true'>በሂደት ላይ</td>";
}
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body { background: #f0f4f8; color: #222; font-size: 16px; }
.header { background: #fff; padding: 14px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid #0a3d62; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.logo { background: linear-gradient(135deg, #0a3d62, #1e8449); color: #fff; width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
.header h1 { font-size: 1rem; color: #0a3d62; }
.header p { font-size: 0.8rem; color: #1e8449; font-weight: bold; }
.login-box { max-width: 400px; margin: 35px auto; background: #fff; padding: 26px 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); text-align: center; border-top: 5px solid #0a3d62; width: 92%; }
input, textarea, select { width: 100%; padding: 13px; margin-bottom: 12px; border: 1.5px solid #ccc; border-radius: 10px; font-size: 1rem; }
.btn { width: 100%; padding: 13px; background: #0a3d62; color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
.btn-gold { background: #f1c40f; color: #111; }
.btn-green { background: #1e8449; }
.btn-red { background: #c0392b; width: auto; padding: 7px 14px; font-size: 0.85rem; margin: 0; }
.btn-del { background: #c0392b; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }
#dashboard { display: none; }
.topbar { background: linear-gradient(90deg, #0a3d62, #1e8449); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.wrap { max-width: 1000px; margin: 16px auto; padding: 0 12px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.stat { background: #fff; padding: 14px; border-radius: 12px; border-left: 4px solid #0a3d62; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
.stat h4 { font-size: 0.8rem; color: #666; }
.stat div { font-size: 1.25rem; font-weight: bold; color: #0a3d62; }
.tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
.tool-btn { background: #fff; border: 1.5px solid #0a3d62; color: #0a3d62; padding: 12px 6px; border-radius: 10px; font-weight: bold; font-size: 0.88rem; cursor: pointer; }
.tool-btn.active { background: #0a3d62; color: #fff; }
.panel { background: #fff; padding: 18px; border-radius: 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); }
.panel h3 { color: #0a3d62; margin-bottom: 14px; border-bottom: 2px solid #f0f4f8; padding-bottom: 8px; }
.card { background: #f4f6f9; padding: 14px; border-radius: 10px; margin-top: 12px; border-left: 4px solid #1e8449; }
.badge { background: #f1c40f; padding: 3px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: bold; display: inline-block; }
table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
th { background: #1e8449; color: #fff; }
.footer { text-align: center; padding: 20px; font-size: 0.85rem; color: #555; }
.dev { display: inline-block; background: #0a3d62; color: #f1c40f; padding: 6px 14px; border-radius: 20px; font-weight: bold; margin-top: 6px; }
</style>
</head>
<body>

<div class="header">
    <div class="logo">🎓</div>
    <div>
        <h1>ካማሺ ዞን ትምህርት፣ አቅም ግንባታና ሲቪል ሰርቪስ መምሪያ</h1>
        <p>ቤኒሻንጉል ጉሙዝ ክልል — ሁለገብ ዲጂታል ፖርታል</p>
    </div>
</div>

<div id="loginSection" class="login-box">
    <h2 style="color:#0a3d62; margin-bottom:8px;">🔐 የመስሪያ ቤቶች መግቢያ</h2>
    <p id="errorMsg" style="color:#c0392b; font-weight:bold; display:none; margin-bottom:10px;">❌ የተሳሳተ መግቢያ መረጃ!</p>
    <input type="text" id="username" placeholder="የተጠቃሚ ስም (admin)">
    <input type="password" id="password" placeholder="የይለፍ ቃል (1234)">
    <button type="button" class="btn" onclick="checkLogin()">ግባ (Login)</button>
    <button type="button" class="btn btn-gold" onclick="quickLogin()">⚡ በዋና አስተዳዳሪ (Admin) በፍጥነት ግባ</button>
    <a href="index.html" style="display:block; margin-top:10px; color:#0a3d62; font-weight:bold; text-decoration:none;">← ወደ ዋናው ገጽ ተመለስ</a>
</div>

<div id="dashboard">
    <div class="topbar">
        <span>👋 እንኳን ደህና መጡ፣ <strong>ዋና አስተዳዳሪ</strong></span>
        <button type="button" class="btn btn-red" onclick="logout()">ውጣ</button>
    </div>

    <div class="wrap">
        <div class="stats">
            <div class="stat"><h4>የተመዘገቡ ዜናዎች</h4><div id="postCount">0 መረጃዎች</div></div>
            <div class="stat" style="border-color:#1e8449;"><h4>የመረጃ ማከማቻ</h4><div style="color:#1e8449;">💾 ቋሚ (Saved)</div></div>
        </div>

        <div class="tabs">
            <button type="button" class="tool-btn active" onclick="openTab('p1', this)">📰 መረጃ መለጠፊያ</button>
            <button type="button" class="tool-btn" onclick="openTab('p2', this)">📊 Excel ሰንጠረዥ</button>
            <button type="button" class="tool-btn" onclick="openTab('p3', this)">🏢 የወረዳዎች መረጃ</button>
            <button type="button" class="tool-btn" onclick="openTab('p4', this)">🔗 ዋናውን ገጽ እይ</button>
        </div>

        <div id="p1" class="panel">
            <h3>📰 ደብዳቤና ማስታወቂያ መለጠፊያ (በindex.html ላይ ይታያል)</h3>
            <select id="postCat">
                <option value="አስቸኳይ ማስታወቂያ">📌 አስቸኳይ ማስታወቂያ</option>
                <option value="ኦፊሴላዊ ደብዳቤ">📄 ኦፊሴላዊ ደብዳቤ</option>
                <option value="የስራ እንቅስቃሴ ሪፖርት">📸 የስራ እንቅስቃሴ ሪፖርት</option>
                <option value="የቅጥርና ጨረታ ማስታወቂያ">📢 የቅጥርና ጨረታ ማስታወቂያ</option>
            </select>
            <input type="text" id="newsTitle" placeholder="የመልዕክቱ ርዕስ...">
            <textarea id="newsBody" rows="4" placeholder="ዝርዝር መልዕክቱን እዚህ ይጻፉ..."></textarea>
            <button type="button" class="btn btn-green" onclick="addPost()">🚀 መረጃውን አትምና አስቀምጥ</button>
            <div id="postList"></div>
        </div>

        <div id="p2" class="panel" style="display:none;">
            <h3>📊 የExcel መረጃ መመዝገቢያ</h3>
            <div style="overflow-x:auto;">
                <table>
