<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ካማሺ ዞን — ሁለገብ የዘርፎችና የተማሪዎች ዲጂታል ፖርታል</title>
<script>
var DEPT_KEY = "kamashi_dept_forms";
var STU_KEY = "kamashi_student_forms";
var NEWS_KEY = "kamashi_news_data";

function checkLogin() {
    var u = document.getElementById("username").value.trim();
    var p = document.getElementById("password").value.trim();
    if (u === "admin" && (p === "1234" || p === "admin123" || p === "kamashi2026")) {
        openDashboard();
    } else {
        document.getElementById("errorMsg").style.display = "block";
    }
}

function quickLogin() {
    openDashboard();
}

function openDashboard() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    renderDeptRecords();
    renderStudentRecords();
}

function logout() {
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginSection").style.display = "block";
}

function openTab(id, btn) {
    var panels = document.querySelectorAll(".panel");
    for (var i = 0; i < panels.length; i++) panels[i].style.display = "none";
    var btns = document.querySelectorAll(".tool-btn");
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
    document.getElementById(id).style.display = "block";
    btn.classList.add("active");
}

function getData(key) {
    var d = localStorage.getItem(key);
    return d ? JSON.parse(d) : [];
}

function saveDeptForm() {
    var sector = document.getElementById("deptSector").value;
    var woreda = document.getElementById("deptWoreda").value;
    var title = document.getElementById("deptTitle").value.trim();
    var desc = document.getElementById("deptDesc").value.trim();
    var publish = document.getElementById("publishPublic").checked;

    if (!title || !desc) { alert("እባክዎ የጉዳዩን ርዕስና ዝርዝር ተግባር ይሙሉ!"); return; }

    var today = new Date().toLocaleDateString('am-ET');
    var record = { id: Date.now(), sector: sector, woreda: woreda, title: title, desc: desc, date: today };
    
    var list = getData(DEPT_KEY);
    list.unshift(record);
    localStorage.setItem(DEPT_KEY, JSON.stringify(list));

    if (publish) {
        var news = getData(NEWS_KEY);
        news.unshift({ id: record.id, category: sector + " (" + woreda + ")", title: title, body: desc, date: today });
        localStorage.setItem(NEWS_KEY, JSON.stringify(news));
    }

    document.getElementById("deptTitle").value = "";
    document.getElementById("deptDesc").value = "";
    renderDeptRecords();
    alert("✅ የዘርፉ መጻጻፊያ ቅጽ በቋሚነት ተመዝግቧል!");
}

function deleteDept(id) {
    var list = getData(DEPT_KEY).filter(function(item) { return item.id !== id; });
    localStorage.setItem(DEPT_KEY, JSON.stringify(list));
    renderDeptRecords();
}

function renderDeptRecords() {
    var list = getData(DEPT_KEY);
    var filter = document.getElementById("filterSector").value;
    var container = document.getElementById("deptList");
    document.getElementById("deptCount").innerText = list.length + " መዝገቦች";

    var filtered = filter === "ALL" ? list : list.filter(function(i) { return i.sector === filter; });

    if (filtered.length === 0) {
        container.innerHTML = "<p style='color:#666; margin-top:12px;'>በዚህ ዘርፍ የተመዘገበ መጻጻፊያ የለም።</p>";
        return;
    }

    var html = "";
    for (var i = 0; i < filtered.length; i++) {
        html += "<div class='card'>" +
                "<div style='display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px;'>" +
                "<span class='badge'>" + filtered[i].sector + " — " + filtered[i].woreda + " (" + filtered[i].date + ")</span>" +
                "<button type='button' class='btn-del' onclick='deleteDept(" + filtered[i].id + ")'>🗑️ አጥፋ</button>" +
                "</div>" +
                "<h4 style='margin:6px 0; color:#0a3d62;'>" + filtered[i].title + "</h4>" +
                "<p>" + filtered[i].desc + "</p></div>";
    }
    container.innerHTML = html;
}

function saveStudentForm() {
    var formType = document.getElementById("stuFormType").value;
    var stuName = document.getElementById("stuName").value.trim();
    var stuGender = document.getElementById("stuGender").value;
    var stuGrade = document.getElementById("stuGrade").value.trim();
    var stuSchool = document.getElementById("stuSchool").value.trim();
    var stuNote = document.getElementById("stuNote").value.trim();

    if (!stuName || !stuGrade || !stuSchool) { alert("እባክዎ የተማሪውን ሙሉ ስም፣ ክፍል እና ትምህርት ቤት ያስገቡ!"); return; }

    var today = new Date().toLocaleDateString('am-ET');
    var list = getData(STU_KEY);
    list.unshift({ id: Date.now(), formType: formType, name: stuName, gender: stuGender, grade: stuGrade, school: stuSchool, note: stuNote, date: today });
    localStorage.setItem(STU_KEY, JSON.stringify(list));

    document.getElementById("stuName").value = "";
    document.getElementById("stuGrade").value = "";
    document.getElementById("stuSchool").value = "";
    document.getElementById("stuNote").value = "";
    renderStudentRecords();
    alert("✅ የተማሪው መረጃ በቋሚነት ተመዝግቧል!");
}

function deleteStudent(id) {
    var list = getData(STU_KEY).filter(function(item) { return item.id !== id; });
    localStorage.setItem(STU_KEY, JSON.stringify(list));
    renderStudentRecords();
}

function renderStudentRecords() {
    var list = getData(STU_KEY);
    var filter = document.getElementById("filterStuType").value;
    var container = document.getElementById("stuList");
    document.getElementById("stuCount").innerText = list.length + " ተማሪዎች";

    var filtered = filter === "ALL" ? list : list.filter(function(i) { return i.formType === filter; });

    if (filtered.length === 0) {
        container.innerHTML = "<p style='color:#666; margin-top:12px;'>የተመዘገበ የተማሪ መረጃ የለም።</p>";
        return;
    }

    var html = "";
    for (var i = 0; i < filtered.length; i++) {
        var badgeColor = filtered[i].formType.indexOf("ያቋረጡ") !== -1 ? "background:#ffcdd2; color:#b71c1c;" : (filtered[i].formType.indexOf("ቅበላ") !== -1 ? "background:#c8e6c9; color:#1b5e20;" : "background:#fff9c4; color:#f57f17;");
        html += "<div class='card'>" +
                "<div style='display:flex; justify-content:space-between; align-items:center;'>" +
                "<span class='badge' style='" + badgeColor + "'>" + filtered[i].formType + " (" + filtered[i].date + ")</span>" +
                "<button type='button' class='btn-del' onclick='deleteStudent(" + filtered[i].id + ")'>🗑️ አጥፋ</button>" +
                "</div>" +
                "<h4 style='margin:6px 0; color:#0a3d62;'>👤 " + filtered[i].name + " (" + filtered[i].gender + ")</h4>" +
                "<p style='font-size:0.9rem;'><strong>ክፍል፦</strong> " + filtered[i].grade + " | <strong>ት/ቤት/ወረዳ፦</strong> " + filtered[i].school + "</p>" +
                (filtered[i].note ? "<p style='font-size:0.88rem; color:#444; margin-top:4px;'><strong>ማብራሪያ/ምክንያት፦</strong> " + filtered[i].note + "</p>" : "") +
                "</div>";
    }
    container.innerHTML = html;
}

function addRow() {
    var tbody = document.getElementById("excelBody");
    var n = tbody.rows.length + 1;
    var row = tbody.insertRow();
    row.innerHTML = "<td contenteditable='true'>" + n + "</td><td contenteditable='true'>አዲስ ዘርፍ/ወረዳ</td><td contenteditable='true'>0</td><td contenteditable='true'>ተከናውኗል</td>";
}
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body { background: #f0f4f8; color: #222; font-size: 16px; }
.header { background: #fff; padding: 14px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid #0a3d62; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.logo { background: linear-gradient(135deg, #0a3d62, #1e8449); color: #fff; width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
.header h1 { font-size: 1rem; color: #0a3d62; }
.header p { font-size: 0.8rem; color: #1e8449; font-weight: bold; }
.login-box { max-width: 400px; margin: 35px auto; background: #fff; padding: 26px 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); text-align: center; border-top: 5px solid #0a3d62; width: 92%; }
input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1.5px solid #ccc; border-radius: 10px; font-size: 0.98rem; background: #fff; }
label.chk { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; margin-bottom: 12px; font-weight: bold; color: #0a3d62; cursor: pointer; }
.btn { width: 100%; padding: 13px; background: #0a3d62; color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
.btn-gold { background: #f1c40f; color: #111; }
.btn-green { background: #1e8449; }
.btn-red { background: #c0392b; width: auto; padding: 7px 14px; font-size: 0.85rem; margin: 0; }
.btn-del { background: #c0392b; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }
#dashboard { display: none; }
.topbar { background: linear-gradient(90deg, #0a3d62, #1e8449); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.wrap { max-width: 1000px; margin: 16px auto; padding: 0 12px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.stat { background: #fff; padding: 14px; border-radius: 12px; border-left: 4px solid #0a3d62; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
.stat h4 { font-size: 0.8rem; color: #666; }
.stat div { font-size: 1.2rem; font-weight: bold; color: #0a3d62; }
.tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
