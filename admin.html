<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ካማሺ ዞን ዲጂታል ፖርታል</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f0f4f8;color:#222}
.hd{background:#0a3d62;color:#fff;padding:14px;text-align:center}
.bx{max-width:420px;margin:25px auto;background:#fff;padding:20px;border-radius:10px;width:92%}
input,select,textarea{width:100%;padding:11px;margin-bottom:10px;border:1px solid #bbb;border-radius:7px;font-size:1rem}
.btn{width:100%;padding:12px;background:#0a3d62;color:#fff;border:none;border-radius:7px;font-weight:bold;cursor:pointer;margin-bottom:8px}
.gold{background:#f1c40f;color:#111}
.grn{background:#1e8449}
.red{background:#c0392b;width:auto;padding:6px 12px}
#dash{display:none;max-width:800px;margin:12px auto;padding:0 10px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tb{flex:1;padding:10px 4px;border:1px solid #0a3d62;background:#fff;color:#0a3d62;font-weight:bold;border-radius:7px;font-size:0.82rem}
.tb.act{background:#0a3d62;color:#fff}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.mlbl{background:#e3f2fd;border:1px dashed #0a3d62;color:#0a3d62;padding:9px;text-align:center;border-radius:7px;font-size:0.82rem;font-weight:bold;display:block}
.itm{background:#f8fafc;padding:12px;border-left:4px solid #1e8449;margin-top:10px;border-radius:6px;border:1px solid #ddd}
img.prev{max-width:100%;max-height:200px;margin-top:8px;border-radius:6px;display:block}
</style>
</head>
<body>

<div class="hd"><h3>ካማሺ ዞን ትምህርት፣ አቅም ግንባታና ሲቪል ሰርቪስ መምሪያ</h3></div>

<div id="lBox" class="bx">
<h3 style="text-align:center;color:#0a3d62;margin-bottom:12px">🔐 የመስሪያ ቤቶች መግቢያ</h3>
<input type="text" id="u" placeholder="የተጠቃሚ ስም (admin)">
<input type="password" id="p" placeholder="የይለፍ ቃል (1234)">
<button type="button" class="btn" onclick="go()">ግባ (Login)</button>
<button type="button" class="btn gold" onclick="openD()">⚡ በዋና አስተዳዳሪ በፍጥነት ግባ</button>
<a href="index.html" style="display:block;text-align:center;margin-top:8px;color:#0a3d62">← ወደ ዋናው ገጽ ተመለስ</a>
</div>

<div id="dash">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
<strong>👋 እንኳን ደህና መጡ (Admin)</strong>
<button type="button" class="btn red" onclick="location.reload()">ውጣ</button>
</div>

<div class="tabs">
<button type="button" class="tb act" onclick="tab('s1',this)">🏢 የዘርፎች ቅጽ</button>
<button type="button" class="tb" onclick="tab('s2',this)">🎓 የተማሪዎች ቅጽ</button>
<button type="button" class="tb" onclick="tab('s3',this)">🔗 ሸር ማድረጊያ</button>
</div>

<div id="s1" class="card">
<h4 style="color:#0a3d62;margin-bottom:10px">🏢 የዘርፎች መጻጻፊያና ፋይል መላኪያ</h4>
<select id="sec">
<option>1. የመርሱ ዘርፍ</option>
<option>2. የመምህራን ሙያ ፍቃድና እድሳት ዘርፍ</option>
<option>3. የተማሪዎች ምዝገባና ፈተና ማደራጃ ዘርፍ</option>
<option>4. የአይሲቲ (ICT) ዘርፍ</option>
<option>5. የሰው ሀብት ስራ አመራር ቡድን</option>
<option>6. የሰው ሀብት ስራ አመራር አፈፃፀም ክትትል ግምገማ ቡድን</option>
<option>7. የሰው ሀብት ልማት ዘርፍ</option>
<option>8. የለውጥ ዘርፍ</option>
<option>9. የስነምግባር መከታተያ ዘርፍ</option>
</select>
<input type="text" id="dt" placeholder="የጉዳዩ ርዕስ...">
<textarea id="db" rows="3" placeholder="ዝርዝር መልዕክት..."></textarea>

<div class="mgrid">
<label class="mlbl">📷 ፎቶ ካሜራ<input type="file" accept="image/*" capture="environment" hidden onchange="addF(this,'img')"></label>
<label class="mlbl">🎥 ቪዲዮ ካሜራ<input type="file" accept="video/*" capture="environment" hidden onchange="addF(this,'vid')"></label>
<label class="mlbl">🖼️ ፎቶ አፕሎድ<input type="file" accept="image/*" hidden onchange="addF(this,'img')"></label>
<label class="mlbl">📁 ፋይል አፕሎድ<input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx" hidden onchange="addF(this,'doc')"></label>
</div>
<p id="fInfo" style="color:#1e8449;font-size:0.85rem;font-weight:bold;margin-bottom:8px"></p>

<button type="button" class="btn grn" onclick="svD()">💾 መዝግብና አስቀምጥ</button>
<div id="dOut"></div>
</div>

<div id="s2" class="card" style="display:none">
<h4 style="color:#0a3d62;margin-bottom:10px">🎓 የተማሪዎች መከታተያ ቅጽ</h4>
<select id="st">
<option>📝 የተማሪዎች ቅበላ መመዝገቢያ ቅጽ</option>
<option>⚠️ ያቋረጡ ተማሪዎች መከታተያ ቅጽ</option>
<option>✅ መማር ላይ ያሉ ተማሪዎች መከታተያ ቅጽ</option>
</select>
<input type="text" id="sn" placeholder="የተማሪው ሙሉ ስም...">
<input type="text" id="sg" placeholder="ክፍል እና ትምህርት ቤት...">
<textarea id="sno" rows="2" placeholder="ተጨማሪ ማብራሪያ / ምክንያት..."></textarea>
<button type="button" class="btn grn" onclick="svS()">💾 የተማሪውን መረጃ መዝግብ</button>
<div id="sOut"></div>
</div>

<div id="s3" class="card" style="display:none">
<h4 style="color:#0a3d62;margin-bottom:10px">🔗 ፖርታሉን ለሌሎች ያጋሩ (Share)</h4>
<button type="button" class="btn" onclick="shAll()">📤 በስልክዎ ላይ ባሉ አፖች አጋራ</button>
<a href="https://t.me" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;background:#0088cc">✈️ በTelegram አጋራ</a>
<a href="https://whatsapp.com" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;background:#25D366">📱 በWhatsApp አጋራ</a>
</div>
</div>

<script>
var cFile=null;
function go(){if(document.getElementById("u").value.trim()==="admin"&&document.getElementById("p").value.trim()==="1234")openD();else alert("የተሳሳተ መረጃ!");}
function openD(){document.getElementById("lBox").style.display="none";document.getElementById("dash").style.display="block";ld();}
function tab(id,b){["s1","s2","s3"].forEach(function(x){document.getElementById(x).style.display="none"});document.querySelectorAll(".tb").forEach(function(x){x.classList.remove("act")});document.getElementById(id).style.display="block";b.classList.add("act");}
function addF(inp,ty){if(!inp.files||!inp.files[0])return;var f=inp.files[0];document.getElementById("fInfo").innerText="📎 የተመረጠ፦ "+f.name;if(ty==="img"){var r=new FileReader();r.onload=function(e){var im=new Image();im.onload=function(){var c=document.createElement("canvas");var w=400;c.width=w;c.height=im.height*(w/im.width);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cFile={ty:"img",nm:f.name,dt:c.toDataURL("image/jpeg",0.6)};};im.src=e.target.result;};r.readAsDataURL(f);}else{cFile={ty:ty,nm:f.name,dt:""};}}
function svD(){var s=document.getElementById("sec").value,t=document.getElementById("dt").value,b=document.getElementById("db").value;if(!t||!b)return alert("ርዕስና መልዕክት ይሙሉ!");var l=JSON.parse(localStorage.getItem("kd")||"[]");l.unshift({id:Date.now(),s:s,t:t,b:b,f:cFile,d:new Date().toLocaleDateString()});try{localStorage.setItem("kd",JSON.stringify(l));}catch(e){return alert("ቦታ ሞልቷል፣ የድሮ ፎቶዎችን ያጥፉ!");}document.getElementById("dt").value="";document.getElementById("db").value="";document.getElementById("fInfo").innerText="";cFile=null;ld();}
function svS(){var ty=document.getElementById("st").value,n=document.getElementById("sn").value,g=document.getElementById("sg").value,no=document.getElementById("sno").value;if(!n||!g)return alert("ስምና ክፍል ይሙሉ!");var l=JSON.parse(localStorage.getItem("ks")||"[]");l.unshift({id:Date.now(),ty:ty,n:n,g:g,no:no,d:new Date().toLocaleDateString()});localStorage.setItem("ks",JSON.stringify(l));document.getElementById("sn").value="";document.getElementById("sg").value="";document.getElementById("sno").value="";ld();}
function del(k,id){var l=JSON.parse(localStorage.getItem(k)||"[]").filter(function(x){return x.id!==id});localStorage.setItem(k,JSON.stringify(l));ld();}
function shAll(){if(navigator.share)navigator.share({title:"ካማሺ ዞን ፖርታል",url:"https://github.io"});else alert("https://github.io");}
function shTxt(t,b){var m=t+"\n"+b+"\nhttps://github.io";if(navigator.share)navigator.share({title:t,text:m});else window.open("https://t.me&text="+encodeURIComponent(m));}
function ld(){
document.getElementById("dOut").innerHTML=JSON.parse(localStorage.getItem("kd")||"[]").map(function(i){var m="";if(i.f){if(i.f.ty==="img")m="<img src='"+i.f.dt+"' class='prev'>";else m="<p style='color:#0a3d62;font-size:0.85rem'>📎 ፋይል/ቪዲዮ፦ "+i.f.nm+"</p>";}return "<div class='itm'><div style='display:flex;justify-content:space-between'><b>"+i.s+"</b><button class='red' style='padding:2px 6px' onclick='del(\"kd\","+i.id+")'>🗑️</button></div><small>"+i.d+"</small><br><b>"+i.t+"</b><p>"+i.b+"</p>"+m+"<button type='button' class='btn' style='margin-top:8px;padding:6px;font-size:0.85rem;background:#0088cc' onclick='shTxt(\""+i.t.replace(/"/g,'')+"\",\""+i.b.replace(/"/g,'')+"\")'>📤 ሸር አድርግ (Share)</button></div>";}).join("");
document.getElementById("sOut").innerHTML=JSON.parse(localStorage.getItem("ks")||"[]").map(function(i){return "<div class='itm'><div style='display:flex;justify-content:space-between'><b>"+i.ty+"</b><button class='red' style='padding:2px 6px' onclick='del(\"ks\","+i.id+")'>🗑️</button></div><small>"+i.d+"</small><br>👤 <b>"+i.n+"</b> — "+i.g+"<br>"+i.no+"</div>";}).join("");
}
</script>
</body>
</html>
